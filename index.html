<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  :root {
    --bg: #084F6A;
    --fill: #0B6B8E;
    --fg: #FFFFFF;
    --muted: rgba(255,255,255,.6);
    --font: "Century Gothic", "CenturyGothic", "TeX Gyre Adventor", "URW Gothic", "Avant Garde", "Futura", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-weight: 700;
    overflow: hidden; cursor: pointer; user-select: none;
  }
  [hidden] { display: none !important; }

  /* Ansicht: Balken / Zahlen */
  #fill { position: fixed; inset: 0; background: var(--fill); transform-origin: left center; }
  #time {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: min(28vw, 50vh); line-height: 1;
  }
  .digits span { display: inline-block; text-align: center; }
  .digits .d { width: .62em; }
  .digits .c { width: .32em; }

  /* Ansicht: Zug */
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; background: #6fa848; }
  #clock {
    position: fixed; top: 3vh; right: 3vw;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-radius: 16px; padding: .18em .42em .26em;
    font-size: clamp(34px, 5vw, 110px); line-height: 1;
    box-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  #clock { cursor: pointer; transition: transform .15s; }
  #clock:hover { transform: scale(1.03); }
  #clock .bar { height: .06em; margin-top: .12em; border-radius: 1em; background: rgba(255,255,255,.25); overflow: hidden; }
  #clock .bar i { display: block; height: 100%; width: 100%; background: var(--fg); transform-origin: left; }
  #tag {
    position: fixed; left: 0; top: 0;
    background: var(--bg); color: var(--fg); font-size: clamp(13px, 1.3vw, 22px);
    padding: .25em .55em; border-radius: 8px; white-space: nowrap; pointer-events: none;
    box-shadow: 0 3px 10px rgba(0,0,0,.3); font-variant-numeric: tabular-nums; min-width: 3.6em; text-align: center;
  }
  #tag::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border: 6px solid transparent; border-bottom: 0; border-top-color: var(--bg);
  }
  #route {
    position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%);
    width: min(70vw, 1100px); font-size: clamp(11px, 1vw, 16px); font-weight: 700;
    background: color-mix(in srgb, var(--bg) 92%, transparent); color: var(--fg);
    border-radius: 12px; padding: .7em 1.4em .9em; box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  #route { cursor: ew-resize; touch-action: none; }
  #route .labels span:nth-child(2) { opacity: .75; font-weight: 400; }
  #route .labels { display: flex; justify-content: space-between; margin-bottom: .5em; letter-spacing: .02em; }
  #route .track { position: relative; height: .8em; display: flex; transition: height .15s; }
  #route:hover .track, #route.scrub .track { height: 1.1em; }
  #route .track span { height: 100%; }
  #route .track span:first-child { border-radius: 1em 0 0 1em; }
  #route .track span:nth-last-child(3) { border-radius: 0 1em 1em 0; }
  #route .done { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(8,40,55,.55); border-radius: 1em 0 0 1em; }
  #route .loco {
    position: absolute; top: 50%; width: 1.9em; height: 1.15em; transform: translate(-50%, -50%);
    background: #d6372b; border: 2px solid #fff; border-radius: .25em .6em .6em .25em;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }

  #editor {
    position: fixed; top: calc(3vh + clamp(34px, 5vw, 110px) * 1.75); right: 3vw; z-index: 5;
    background: var(--bg); color: var(--fg); border-radius: 16px; padding: 18px 20px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 16px; cursor: default; width: 330px; max-width: calc(100vw - 32px);
  }
  body:not(.zug) #editor { top: 3vh; }
  #editor .ed-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #editor .ed-field { display: grid; justify-items: center; gap: 4px; }
  #editor input {
    width: 2.6em; font: inherit; font-size: 46px; font-weight: 700; text-align: center; line-height: 1.1;
    background: rgba(255,255,255,.1); color: var(--fg); border: 2px solid rgba(255,255,255,.25); border-radius: 10px; padding: 2px 0;
  }
  #editor input:focus { outline: none; border-color: var(--fg); background: rgba(255,255,255,.16); }
  #editor .ed-colon { font-size: 46px; padding-bottom: 22px; }
  #editor label { font-size: 12px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  #editor button {
    font: inherit; font-weight: 700; color: var(--fg); background: rgba(255,255,255,.12); border: 0; border-radius: 8px; cursor: pointer;
  }
  #editor button:hover { background: rgba(255,255,255,.24); }
  #editor button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #editor .step { width: 100%; padding: 2px 0; font-size: 13px; }
  #editor .ed-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 12px; }
  #editor .ed-presets button { padding: 7px 0; font-size: 14px; }
  #editor .ed-presets button::after { content: ' min'; font-weight: 400; opacity: .7; font-size: 12px; }
  #editor .ed-actions { display: flex; gap: 8px; }
  #editor .ed-actions button { flex: 1; padding: 9px 0; font-size: 15px; }
  #editor .ed-actions .primary { background: var(--fg); color: var(--bg); }
  #editor .ed-actions .primary:hover { background: rgba(255,255,255,.85); }
  #hint {
    position: fixed; left: 50%; bottom: calc(3vh + 6.2em); transform: translateX(-50%);
    font-size: clamp(13px, 1.3vw, 20px); font-weight: 400; letter-spacing: .03em;
    background: rgba(0,0,0,.5); color: #fff; padding: .5em 1.1em; border-radius: 999px;
    white-space: nowrap; transition: opacity .4s;
  }
  body:not(.zug) #hint { background: transparent; color: var(--muted); bottom: 4vh; }
  body.running #hint { opacity: 0; }
  body.done #time, body.done #clock, body.done #tag { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { body.done #time, body.done #clock, body.done #tag { animation: none; } }
</style>
</head>
<body>
<div id="fill"></div>
<div id="time" class="digits"></div>
<canvas id="world"></canvas>
<div id="tag"></div>
<div id="clock"><div class="digits" id="clockDigits"></div><div class="bar"><i id="clockBar"></i></div></div>
<div id="route"><div class="labels"><span>Hauptbahnhof</span><span>ziehen zum Spulen</span><span>Ziel</span></div><div class="track" id="routeTrack"><div class="done" id="routeDone"></div><div class="loco" id="routeLoco"></div></div></div>
<div id="editor" hidden>
  <div class="ed-row">
    <div class="ed-field"><button class="step" data-d="60" aria-label="Eine Minute mehr">▲</button><input id="edMin" inputmode="numeric" maxlength="3" aria-label="Minuten"><button class="step" data-d="-60" aria-label="Eine Minute weniger">▼</button><label for="edMin">Min</label></div>
    <span class="ed-colon">:</span>
    <div class="ed-field"><button class="step" data-d="5" aria-label="Fünf Sekunden mehr">▲</button><input id="edSek" inputmode="numeric" maxlength="2" aria-label="Sekunden"><button class="step" data-d="-5" aria-label="Fünf Sekunden weniger">▼</button><label for="edSek">Sek</label></div>
  </div>
  <div class="ed-presets"><button data-m="1">1</button><button data-m="2">2</button><button data-m="3">3</button><button data-m="5">5</button><button data-m="10">10</button><button data-m="15">15</button><button data-m="20">20</button><button data-m="30">30</button></div>
  <div class="ed-actions"><button id="edCancel">Abbrechen</button><button id="edOk" class="primary">Übernehmen</button></div>
</div>
<div id="hint">Klick: Start/Pause · Uhr anklicken: Zeit einstellen · Balken ziehen: spulen · Z: Ansicht</div>
<script>
(() => {
  /* ======================= Parameter ======================= */
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(q.get(k)); return isFinite(v) && v > 0 ? v : d; };
  let total = Math.round((num('min', 0) * 60 + num('sek', 0)) * 1000) || 5 * 60 * 1000;
  const hex = k => { const v = (q.get(k) || '').replace('#', ''); return /^[0-9a-fA-F]{6}$/.test(v) ? '#' + v : null; };
  const rs = document.documentElement.style;
  if (hex('bg')) rs.setProperty('--bg', hex('bg'));
  if (hex('zug')) rs.setProperty('--fill', hex('zug'));
  if (hex('farbe')) rs.setProperty('--fg', hex('farbe'));
  const $ = id => document.getElementById(id);
  const hint = $('hint'), HINT = hint.textContent;
  if (q.get('hinweis') === '0') hint.hidden = true;
  const VIEWS = ['zug', 'balken', 'zahlen'];
  let view = VIEWS.includes(q.get('ansicht')) ? q.get('ansicht') : 'zug';
  const bigClock = q.get('uhr') !== 'klein';
  const showRoute = q.get('strecke') !== '0';

  const timeEl = $('time'), fillEl = $('fill'), world = $('world'), tag = $('tag'),
        clock = $('clock'), clockDigits = $('clockDigits'), clockBar = $('clockBar'),
        route = $('route'), routeDone = $('routeDone'), routeLoco = $('routeLoco');

  /* ======================= Timer ======================= */
  let remaining = total, endAt = null, lastTxt = '';
  const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const digitsHTML = t => [...t].map(c => `<span class="${c === ':' ? 'c' : 'd'}">${c}</span>`).join('');
  const now = () => endAt ? Math.max(0, endAt - performance.now()) : remaining;
  function start() { if (endAt || remaining <= 0) return; endAt = performance.now() + remaining; document.body.classList.add('running'); }
  function pause() { if (!endAt) return; remaining = Math.max(0, endAt - performance.now()); endAt = null; document.body.classList.remove('running'); }
  function reset() { endAt = null; remaining = total; document.body.classList.remove('running', 'done'); hint.textContent = HINT; }
  function finish() { remaining = 0; endAt = null; document.body.classList.remove('running'); document.body.classList.add('done'); hint.textContent = 'Angekommen! Klicken oder R für Neustart'; }
  function fullscreen() { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
  function setView(v) {
    view = v;
    document.body.classList.toggle('zug', v === 'zug');
    fillEl.hidden = v !== 'balken';
    timeEl.hidden = v === 'zug';
    world.hidden = tag.hidden = v !== 'zug';
    clock.hidden = v !== 'zug' || !bigClock;
    route.hidden = v !== 'zug' || !showRoute;
  }
  function toggleRun() { endAt ? pause() : (remaining <= 0 ? reset() : start()); }
  function setRemaining(rem) {
    rem = Math.max(0, Math.min(total, rem));
    if (rem <= 0) { remaining = 0; endAt = null; finish(); return; }
    remaining = rem;
    if (endAt) endAt = performance.now() + rem;
    if (document.body.classList.contains('done')) { document.body.classList.remove('done'); hint.textContent = HINT; }
  }
  function setDuration(ms) {
    total = ms; endAt = null; remaining = total; lastTxt = '';
    document.body.classList.remove('running', 'done'); hint.textContent = HINT;
    try {
      const u = new URL(location.href), sec = Math.round(ms / 1000);
      u.searchParams.set('min', Math.floor(sec / 60));
      if (sec % 60) u.searchParams.set('sek', sec % 60); else u.searchParams.delete('sek');
      history.replaceState(null, '', u);
    } catch (e) {}
  }

  /* ---- Zeit einstellen ---- */
  const editor = $('editor'), edMin = $('edMin'), edSek = $('edSek');
  const readEd = () => ((parseInt(edMin.value, 10) || 0) * 60 + (parseInt(edSek.value, 10) || 0)) * 1000;
  function writeEd(ms) {
    const sec = Math.max(1, Math.min(999 * 60 + 59, Math.round(ms / 1000)));
    edMin.value = Math.floor(sec / 60); edSek.value = String(sec % 60).padStart(2, '0');
  }
  function openEditor() { writeEd(total); editor.hidden = false; edMin.focus(); edMin.select(); }
  function closeEditor() { editor.hidden = true; }
  function applyEditor() { const ms = readEd(); if (ms >= 1000) { setDuration(ms); closeEditor(); } else { edSek.focus(); } }
  editor.addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d) writeEd(readEd() + +b.dataset.d * 1000);
    else if (b.dataset.m) { writeEd(+b.dataset.m * 60000); applyEditor(); }
    else if (b.id === 'edOk') applyEditor();
    else if (b.id === 'edCancel') closeEditor();
  });
  editor.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); applyEditor(); }
    else if (e.key === 'Escape') closeEditor();
    else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.target.tagName === 'INPUT') {
      e.preventDefault(); const step = (e.target === edMin ? 60 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
      writeEd(readEd() + step * 1000); e.target.select();
    }
  });
  editor.addEventListener('wheel', e => {
    if (e.target.tagName !== 'INPUT') return;
    e.preventDefault(); writeEd(readEd() + (e.target === edMin ? 60 : 5) * (e.deltaY < 0 ? 1 : -1) * 1000);
  }, { passive: false });
  [edMin, edSek].forEach(i => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, ''); }));
  clock.addEventListener('click', e => { e.stopPropagation(); editor.hidden ? openEditor() : closeEditor(); });

  /* ---- Spulen mit dem Streckenbalken ---- */
  const routeTrack = $('routeTrack');
  let scrubbing = false;
  const scrubTo = e => { const r = routeTrack.getBoundingClientRect(); setRemaining(total * (1 - Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)))); };
  route.addEventListener('pointerdown', e => { e.stopPropagation(); scrubbing = true; route.classList.add('scrub'); try { route.setPointerCapture(e.pointerId); } catch (_) {} scrubTo(e); });
  route.addEventListener('pointermove', e => { if (scrubbing) scrubTo(e); });
  const endScrub = () => { scrubbing = false; route.classList.remove('scrub'); };
  route.addEventListener('pointerup', endScrub); route.addEventListener('pointercancel', endScrub);
  route.addEventListener('click', e => e.stopPropagation());
  route.addEventListener('wheel', e => { e.preventDefault(); setRemaining(now() + (e.deltaY < 0 ? 5000 : -5000)); }, { passive: false });

  document.addEventListener('click', () => {
    if (!editor.hidden) { closeEditor(); return; }
    fullscreen(); toggleRun();
  });
  document.addEventListener('keydown', e => {
    if (e.target && e.target.closest && e.target.closest('#editor')) return;
    if (e.code === 'Space') { e.preventDefault(); toggleRun(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') fullscreen();
    else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); openEditor(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setRemaining(now() + (e.key === 'ArrowLeft' ? 1 : -1) * (e.shiftKey ? 60000 : 10000)); }
    else if (e.key === 'z' || e.key === 'Z') setView(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
  });

  /* ======================= Isometrie-Grundlagen ======================= */
  const HW = 16, HH = 8, WX = 290, WY = 58, ORX = WY * HW, ORY = 170;
  let OX = 0, OY = 0;
  const SX = (x, y) => (x - y) * HW + ORX;
  const SY = (x, y, z = 0) => (x + y) * HH - z + ORY;
  let ROUND = true;
  const P = (x, y, z = 0) => ROUND ? [Math.round(SX(x, y) + OX), Math.round(SY(x, y, z) + OY)] : [SX(x, y) + OX, SY(x, y, z) + OY];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const _sh = new Map();
  function sh(hexc, f) {
    const k = hexc + '|' + f.toFixed(2); let v = _sh.get(k);
    if (!v) { const n = parseInt(hexc.slice(1), 16), c = x => clamp(Math.round(x * f), 0, 255); v = `rgb(${c(n >> 16 & 255)},${c(n >> 8 & 255)},${c(n & 255)})`; _sh.set(k, v); }
    return v;
  }
  function poly(g, pts, fill, edge) {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath(); g.fillStyle = fill; g.fill();
    if (edge) { g.strokeStyle = fill; g.lineWidth = 1; g.stroke(); }
  }
  function line(g, a, b, col, w = 1) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hash = (a, b) => { let h = Math.imul(a * 374761393 + b * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

  /* ---- Bausteine ---- */
  function box(g, x, y, z, w, d, h, col, topCol) {
    const t = z + h;
    poly(g, [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], sh(col, .95), true);
    poly(g, [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], sh(col, .72), true);
    poly(g, [P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], topCol || sh(col, 1.12), true);
  }
  function wins(g, x, y, z, w, d, h, cols, rows, r, c1, c2, p2 = .2) {
    for (let side = 0; side < 2; side++) for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const u0 = (i + .22) / cols, u1 = (i + .78) / cols, z0 = z + (j + .3) * h / rows, z1 = z + (j + .8) * h / rows;
      const c = r() < p2 ? c2 : c1;
      if (side === 0) poly(g, [P(x + w * u0, y + d, z0), P(x + w * u1, y + d, z0), P(x + w * u1, y + d, z1), P(x + w * u0, y + d, z1)], sh(c, .95));
      else poly(g, [P(x + w, y + d * u0, z0), P(x + w, y + d * u1, z0), P(x + w, y + d * u1, z1), P(x + w, y + d * u0, z1)], sh(c, .74));
    }
  }
  function gable(g, x, y, z, w, d, rh, roof, wall) {
    const m = y + d / 2, t = z + rh;
    poly(g, [P(x, y, z), P(x + w, y, z), P(x + w, m, t), P(x, m, t)], sh(roof, .78), true);
    poly(g, [P(x + w, y, z), P(x + w, y + d, z), P(x + w, m, t)], sh(wall, .72), true);
    poly(g, [P(x - .04, y + d + .05, z - .5), P(x + w + .04, y + d + .05, z - .5), P(x + w + .04, m, t), P(x - .04, m, t)], sh(roof, 1), true);
  }
  function cyl(g, cx, cy, z, r, h, col, topCol) {
    const [sx, sy] = P(cx, cy, z), ty = P(cx, cy, z + h)[1], rx = r * HW * 1.414, ry = r * HH * 1.414;
    g.fillStyle = sh(col, .95); g.beginPath(); g.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2); g.fill(); g.fillRect(sx - rx, ty, rx * 2, sy - ty);
    g.fillStyle = sh(col, .74); g.beginPath(); g.ellipse(sx, sy, rx, ry, 0, 0, Math.PI / 2); g.lineTo(sx, ty); g.lineTo(sx + rx, ty); g.closePath(); g.fill();
    g.fillStyle = topCol || sh(col, 1.1); g.beginPath(); g.ellipse(sx, ty, rx, ry, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = sh(col, .6); g.lineWidth = 1; g.stroke();
  }
  function shadowEll(g, x, y, z, rx, ry) { const [sx, sy] = P(x, y, z); g.fillStyle = 'rgba(0,30,0,.22)'; g.beginPath(); g.ellipse(sx + 2, sy + 1, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
  function conifer(g, x, y, z, s) {
    shadowEll(g, x, y, z, 5 * s, 2.4 * s);
    const [bx, by] = P(x, y, z);
    g.fillStyle = '#5b3a1e'; g.fillRect(bx - 1, by - 3, 2, 3);
    for (let i = 0; i < 3; i++) {
      const w = (6.5 - i * 1.6) * s, yb = by - 2 - i * 4 * s, yt = yb - 7.5 * s;
      poly(g, [[bx - w, yb], [bx, yb], [bx, yt]], '#2f7d46');
      poly(g, [[bx, yb], [bx + w, yb], [bx, yt]], '#1d5a33');
    }
  }
  function leafy(g, x, y, z, s, tint) {
    shadowEll(g, x, y, z, 5.5 * s, 2.6 * s);
    const [bx, by] = P(x, y, z);
    g.fillStyle = '#5b3a1e'; g.fillRect(bx - 1, by - 4, 2, 4);
    const c = tint || ['#3d8a3a', '#55a547', '#7cc35f'];
    g.fillStyle = c[0]; g.beginPath(); g.arc(bx, by - 8 * s, 5.5 * s, 0, 7); g.fill();
    g.fillStyle = c[1]; g.beginPath(); g.arc(bx - 1.6 * s, by - 9.4 * s, 3.9 * s, 0, 7); g.fill();
    g.fillStyle = c[2]; g.beginPath(); g.arc(bx - 2.4 * s, by - 10.6 * s, 1.7 * s, 0, 7); g.fill();
  }

  /* ======================= Strecke ======================= */
  const WAY = [[38, 30], [66, 30], [76, 26], [98, 25], [114, 28], [124, 34], [146, 34], [158, 30], [170, 29],

  /* ======================= Bodenebene vorrendern ======================= */

  function warehouse(x, y, w, d) {

  /* ======================= Welt erzeugen ======================= */

          poly(g, quadT(Q, .23, .27, .2, 8.6), 'rgba(0,0,0,.2)'); poly(g, quadT(Q, .73, .77, .2, 8.6), 'rgba(0,0,0,.2)');
        } else {
          poly(g, quadT(Q, .1, .9, 5, 8.6), '#1b2532');
          poly(g, quadT(Q, .12, .3, 5.4, 6.4), 'rgba(160,200,230,.5)');
          poly(g, quadT(Q, .12, .24, 1.6, 2.6), '#fff4b0'); poly(g, quadT(Q, .76, .88, 1.6, 2.6), '#fff4b0');
          poly(g, quadT(Q, 0, 1, 3, 3.8), '#f2f2f2');
        }
      }, lo, hi);
      if (full) {
        const a1 = top(-.25, 0, 12), b2 = top(.15, 0, 18), c2 = top(.45, 0, 12);
        line(g, a1, b2, '#30343a', 1); line(g, c2, b2, '#30343a', 1);
        line(g, top(.05, -.8, 18.5), top(.25, .8, 18.5), '#30343a', 1);
      }
    } else {
      oBox(g, cx, cy, ang, c.L, W, 2.4, 9, '#e9ebee', '#a3a9b2', (g, kind, Q) => {
        if (kind === 'side') {
          poly(g, quadT(Q, 0, 1, 1, 2.2), '#cf2f26');
          poly(g, quadT(Q, .1, .9, 4.6, 7.6), '#24364f');
          for (let i = .1 + .8 / 7; i < .89; i += .8 / 7) poly(g, quadT(Q, i - .012, i + .012, 4.6, 7.6), '#e9ebee');
          poly(g, quadT(Q, .02, .08, .4, 8), '#b7bdc6'); poly(g, quadT(Q, .92, .98, .4, 8), '#b7bdc6');
        } else {
          poly(g, quadT(Q, .3, .7, 0, 8), '#3a3f47');
          if (c.last && kind === 'back') { poly(g, quadT(Q, .08, .2, 1.4, 2.4), '#ff3b2f'); poly(g, quadT(Q, .8, .92, 1.4, 2.4), '#ff3b2f'); }
        }
      }, lo, hi);
      const r0 = Math.max(-.7, lo), r1 = Math.min(.7, hi);
      if (r1 > r0) { const tp = a => P(cx + ux * a * c.L / 2, cy + uy * a * c.L / 2, 11.6); line(g, tp(r0), tp(r1), 'rgba(255,255,255,.35)'); }
    }
  }

  /* ======================= Rendering ======================= */
  const ctx = world.getContext('2d');
  let PX = 2, S = 2, W = 0, H = 0, ready = false, camX = 0, camY = 0, camInit = false;
  const cache = new Map(), smoke = [];

  function sprite(o) {
    let c = cache.get(o.ck); if (c) return c;
    const [l, rr, u, d] = o.ext;
    c = document.createElement('canvas'); c.width = Math.ceil(l + rr); c.height = Math.ceil(u + d);
    const r0 = ROUND; ROUND = true; OX = l - o.sx; OY = u - o.sy;
    o.draw(c.getContext('2d'));
    ROUND = r0; cache.set(o.ck, c); return c;
  }
  const S0 = () => TRAIN_LEN + .3, S1 = () => TL - .6;
  function headS() { return S0() + (S1() - S0()) * (1 - now() / total); }
  // Kamera zielt auf einen über die Strecke gemittelten Punkt → keine Zuckungen in Kurven
  function camTarget(head) {
    let x = 0, y = 0, n = 0;
    for (let d = -5; d <= 3; d += .25) { const a = at(head - 1 + d); x += SX(a.x, a.y); y += SY(a.x, a.y, 6); n++; }
    return [x / n, y / n + H * .06];
  }

  function resize() {
    const vw = innerWidth || document.documentElement.clientWidth, vh = innerHeight || document.documentElement.clientHeight;
    if (vw < 50 || vh < 50) return false;
    const dpr = devicePixelRatio || 1;
    PX = Math.max(2, Math.round(vw / 640));
    S = PX * dpr; W = vw / PX; H = vh / PX;
    world.width = Math.round(vw * dpr); world.height = Math.round(vh * dpr);
    return true;
  }
  function init() {
    if (!resize()) { setTimeout(init, 200); return; }
    if (!ready) {
      try { buildWorld(); buildGround(); buildRouteBar(); ready = true; }
      catch (err) { console.warn('Welt konnte nicht erzeugt werden:', err); setTimeout(init, 600); }
    }
  }
  function buildRouteBar() {
    const COL = { city: '#9aa3ad', sub: '#8fc76a', farm: '#d9c25a', forest: '#3f7f45', ind: '#b18a5a', mtn: '#c7c3bb', farm2: '#b9c96a', town: '#9aa3ad', tunnel: '#3a3633' };
    const runs = [], a0 = S0() - CARS[0].L / 2, a1 = S1() - CARS[0].L / 2;
    for (let sv = a0; sv <= a1; sv += .25) {
      const p = at(sv), b = inTunnel(sv) ? 'tunnel' : biome(p.x, p.y);
      if (runs.length && runs[runs.length - 1][0] === b) runs[runs.length - 1][1] += .25; else runs.push([b, .25]);
    }
    const tot = runs.reduce((a, r) => a + r[1], 0), tr = $('routeTrack');
    tr.querySelectorAll('span').forEach(x => x.remove());
    runs.forEach(([b, l]) => { const x = document.createElement('span'); x.style.width = (l / tot * 100) + '%'; x.style.background = COL[b]; if (b === 'tunnel') x.title = 'Tunnel'; tr.insertBefore(x, routeDone); });
  }

  let lastT = performance.now(), lastEmit = 0;
  function frame(t) {
    const dt = Math.min(60, t - lastT); lastT = t;
    const ms = now();
    if (endAt && ms <= 0) finish();
    const txt = fmt(ms), frac = ms / total;
    if (txt !== lastTxt) { lastTxt = txt; timeEl.innerHTML = digitsHTML(txt); clockDigits.innerHTML = digitsHTML(txt); tag.textContent = txt; }
    fillEl.style.transform = `scaleX(${frac})`;
    clockBar.style.transform = `scaleX(${frac})`;

    if (view === 'zug' && ready) {
      const prog = 1 - frac;
      routeDone.style.width = (prog * 100) + '%'; routeLoco.style.left = (prog * 100) + '%';
      const head = headS(), hp = at(head - CARS[0].L / 2);
      const [tx, ty] = camTarget(head);
      if (!camInit) { camX = tx; camY = ty; camInit = true; }
      const k = 1 - Math.exp(-dt / (scrubbing ? 90 : 260));
      camX += (tx - camX) * k; camY += (ty - camY) * k;
      const offX = W / 2 - camX, offY = H / 2 - camY;          // nicht gerundet → butterweiche Kamerafahrt

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#6fa848'; ctx.fillRect(0, 0, world.width, world.height);
      ctx.setTransform(S, 0, 0, S, 0, 0);
      ctx.imageSmoothingEnabled = false;
      const gx = Math.max(0, Math.floor(-offX)), gy = Math.max(0, Math.floor(-offY));
      const gw = Math.min(ground.width - gx, Math.ceil(W) + 2), gh = Math.min(ground.height - gy, Math.ceil(H) + 2);
      if (gw > 0 && gh > 0) ctx.drawImage(ground, gx, gy, gw, gh, gx + offX, gy + offY, gw, gh);

      const list = [], ghosts = [];
      for (const o of objs) {
        const sx = o.sx + offX, sy = o.sy + offY, e = o.ext;
        if (sx + e[1] < 0 || sx - e[0] > W || sy + e[3] < 0 || sy - e[2] > H) continue;
        list.push({ k: o.k, o, sx, sy });
      }
      // Zug: Wagen werden an den Tunnelportalen abgeschnitten; der Teil im Berg erscheint als Röntgen-Silhouette
      let s = head;
      for (const c of CARS) {
        const sF = s, sB = s - c.L, toA = sv => -1 + 2 * (sv - sB) / c.L, pieces = [];
        if (sIn < 0 || sF <= sIn || sB >= sOut) pieces.push([-1, 1, false]);
        else {
          if (sB < sIn) pieces.push([-1, toA(sIn), false]);
          pieces.push([Math.max(-1, toA(sIn)), Math.min(1, toA(sOut)), true]);
          if (sF > sOut) pieces.push([toA(sOut), 1, false]);
        }
        const gm = carGeom(sF, c);
        for (const [lo, hi, inside] of pieces) {
          if (hi - lo < .01) continue;
          const draw = g => drawCar(g, sF, c, lo, hi);
          if (inside) { ghosts.push(draw); continue; }
          const pa = (lo + 1) / 2, pb = (hi + 1) / 2;
          let key = Math.max(gm.b.x + (gm.f.x - gm.b.x) * pa + gm.b.y + (gm.f.y - gm.b.y) * pa, gm.b.x + (gm.f.x - gm.b.x) * pb + gm.b.y + (gm.f.y - gm.b.y) * pb) + .45;
          if (PORTAL_KEY > 0 && sB < sOut + 3 && sF > sOut - .01) key = Math.max(key, PORTAL_KEY + .01);
          list.push({ k: key, dyn: draw });
        }
        s -= c.L + GAP;
      }
      for (const c of roadCars) {
        const len = c.b - c.a, p = ((t * c.sp + c.ph) % len + len) % len, pos = c.dir > 0 ? c.a + p : c.b - p;
        const x = c.ax === 'x' ? pos : c.c, y = c.ax === 'x' ? c.c : pos;
        if (td(Math.floor(x), Math.floor(y)) < 1.2 || inStation(Math.floor(x), Math.floor(y))) continue;
        const sx = SX(x, y) + offX, sy = SY(x, y) + offY; if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
        const ang = c.ax === 'x' ? (c.dir > 0 ? 0 : Math.PI) : (c.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
        list.push({ k: x + y + .5, dyn: g => { oBox(g, x, y, ang, .5, .26, .6, 2.6, c.col); oBox(g, x - Math.cos(ang) * .04, y - Math.sin(ang) * .04, ang, .26, .22, 3.2, 1.6, '#3a4656', '#4a5a6e'); } });
      }
      for (const w of turbines) {
        const sx = SX(w.x, w.y) + offX, sy = SY(w.x, w.y) + offY; if (sx < -60 || sx > W + 60 || sy < -10 || sy > H + 90) continue;
        list.push({ k: w.x + w.y + 1, dyn: g => {
          shadowEll(g, w.x, w.y, 0, 6, 3);
          const b = P(w.x, w.y, 0), top = P(w.x, w.y, 62);
          g.fillStyle = '#f1f3f5'; g.beginPath(); g.moveTo(b[0] - 2, b[1]); g.lineTo(b[0] + 2, b[1]); g.lineTo(top[0] + 1, top[1]); g.lineTo(top[0] - 1, top[1]); g.closePath(); g.fill();
          box(g, w.x - .12, w.y - .1, 61, .32, .2, 3, '#e6e9ec');
          const hub = P(w.x + .22, w.y + .1, 62.5), a = t * w.sp + w.ph;
          for (let i = 0; i < 3; i++) { const an = a + i * 2.094; line(g, hub, [hub[0] + Math.cos(an) * 20, hub[1] + Math.sin(an) * 20], '#f7f8f9', 2); }
          g.fillStyle = '#9aa0a8'; g.fillRect(hub[0] - 1, hub[1] - 1, 2, 2);
        } });
      }
      list.sort((a, b) => a.k - b.k);
      for (const it of list) {
        if (it.dyn) { ROUND = false; OX = offX; OY = offY; it.dyn(ctx); ROUND = true; continue; }
        ctx.drawImage(sprite(it.o), it.sx - it.o.ext[0], it.sy - it.o.ext[2]);
      }
      if (ghosts.length) {
        ROUND = false; OX = offX; OY = offY;
        ctx.save();
        if (PORTAL_PTS) {            // Röntgenbild nicht über das Portal malen
          const pts = PORTAL_PTS.map(([x, y, z]) => P(x, y, z)).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
          const lo = [], hi = [];
          for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
          for (const p of pts.slice().reverse()) { while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
          const hull = lo.slice(0, -1).concat(hi.slice(0, -1));
          ctx.beginPath(); ctx.rect(-50, -50, W + 100, H + 100);
          hull.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
          ctx.clip('evenodd');
        }
        ctx.globalAlpha = .32; ghosts.forEach(d => d(ctx)); ctx.globalAlpha = 1;
        ctx.restore(); ROUND = true;
      }

      // Rauch
      if (t - lastEmit > 60) {
        lastEmit = t;
        for (const e of emitters) {
          const sx = SX(e.x, e.y) + offX, sy = SY(e.x, e.y, e.z) + offY;
          if (sx < -80 || sx > W + 80 || sy < -120 || sy > H + 40 || Math.random() * e.rate > 60) continue;
          smoke.push({ x: SX(e.x, e.y), y: SY(e.x, e.y, e.z), r: 1.5 * e.big, vx: .008 + Math.random() * .006, vy: -.018 - Math.random() * .01, life: 1, big: e.big });
        }
      }
      for (let i = smoke.length - 1; i >= 0; i--) {
        const p = smoke[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.r += .0045 * dt * p.big; p.life -= .00028 * dt;
        if (p.life <= 0) { smoke.splice(i, 1); continue; }
        const cx = p.x + offX, cy = p.y + offY;
        if (cx < -p.r || cx > W + p.r || cy < -p.r || cy > H + p.r) continue;
        ctx.fillStyle = `rgba(245,245,245,${(p.life * .7).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, 6.283); ctx.fill();
      }

      const tagP = [SX(hp.x, hp.y) + offX, SY(hp.x, hp.y, 30) + offY];
      tag.style.transform = `translate(${(tagP[0] * PX).toFixed(1)}px, ${(tagP[1] * PX).toFixed(1)}px) translate(-50%, -100%)`;
    }
    requestAnimationFrame(frame);
  }

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (!ready) init(); }, 120); });
  setView(view);
  init();
  if (q.get('auto') === '1') start();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
